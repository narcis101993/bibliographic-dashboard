name: Refresh citation data

on:
  schedule:
    - cron: "0 0 1 * *"  # Monthly on the 1st
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Fetch fresh citation data from sources
        run: |
          cd scripts
          python3 fetch_citation_sources.py

      - name: Fetch Crossref counts
        run: |
          cd scripts
          python3 check_crossref_counts.py

      - name: Build citation dataset (v4)
        run: |
          cd scripts
          python3 build_citations_v4.py

      - name: Build dashboard data
        run: |
          cd scripts
          python3 build_dashboard_data.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: refresh citation data $(date +%Y-%m-%d)"
          git push
