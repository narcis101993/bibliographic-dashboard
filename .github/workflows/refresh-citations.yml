name: Refresh citation data

concurrency:
  group: refresh-citations
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 0 1 * *"  # Monthly on the 1st
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Smoke test dashboard JS
        run: |
          node tests/test_app_js_smoke.js

      - name: Validate dashboard data (no writes)
        run: |
          python3 scripts/build_dashboard_data.py --check

      - name: Detect versions
        id: versions
        run: |
          LATEST=$(ls centralizator/ | grep -o 'v[0-9]*' | sort -V | tail -1)
          NEXT="v$((${LATEST#v} + 1))"
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "next=$NEXT" >> $GITHUB_OUTPUT
          echo "Latest version: $LATEST → Next: $NEXT"

      - name: Prepare next version raw folder
        run: |
          LATEST=${{ steps.versions.outputs.latest }}
          NEXT=${{ steps.versions.outputs.next }}
          mkdir -p "citari/$NEXT/raw/datacite_search"
          if [ -f "citari/$LATEST/raw/datacite_search/no_doi_publications.json" ]; then
            cp "citari/$LATEST/raw/datacite_search/no_doi_publications.json" "citari/$NEXT/raw/datacite_search/"
          fi

      - name: Fetch fresh citation data from sources
        run: |
          cd scripts
          python3 fetch_citation_sources.py --source-version ${{ steps.versions.outputs.latest }} --target-version ${{ steps.versions.outputs.next }}

      - name: Fetch Crossref counts
        run: |
          cd scripts
          python3 check_crossref_counts.py --source-version ${{ steps.versions.outputs.latest }} --target-version ${{ steps.versions.outputs.next }}

      - name: Fetch ORCID works (best-effort)
        run: |
          cd scripts
          python3 fetch_orcid.py --source-version ${{ steps.versions.outputs.latest }} --target-version ${{ steps.versions.outputs.next }} || echo "ORCID fetch skipped (best-effort)"

      - name: Fetch Europe PMC counts (best-effort)
        run: |
          cd scripts
          python3 fetch_europepmc.py --source-version ${{ steps.versions.outputs.latest }} --target-version ${{ steps.versions.outputs.next }} || echo "Europe PMC fetch skipped (best-effort)"

      - name: Fetch Fatcat citations (best-effort)
        run: |
          cd scripts
          python3 fetch_fatcat.py --source-version ${{ steps.versions.outputs.latest }} --target-version ${{ steps.versions.outputs.next }} || echo "Fatcat fetch skipped (best-effort)"

      - name: Build citation dataset
        run: |
          cd scripts
          python3 build_citations.py --source-version ${{ steps.versions.outputs.latest }} --target-version ${{ steps.versions.outputs.next }}

      - name: Import Google Scholar BibTeX export
        run: |
          python3 scripts/import_scholar_bibtex.py

      - name: Build dashboard data
        run: |
          cd scripts
          python3 build_dashboard_data.py

      - name: Rebuild minified JS + trimmed Chart.js bundle
        run: |
          npm install --ignore-scripts
          python3 scripts/minify_app_js.py
          python3 scripts/build_chart_bundle.py
          node tests/test_app_js_smoke.js

      - name: Sync dashboard to docs for GitHub Pages
        run: |
          rsync -a --delete dashboard/ docs/
          # Ensure docs has the latest data
          echo "Synced dashboard → docs"

      - name: Update README with latest stats
        run: |
          cd scripts
          python3 update_readme.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: auto-refresh citation data $(date +%Y-%m-%d) — new version ${{ steps.versions.outputs.next }}"
          git push