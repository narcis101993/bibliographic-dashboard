name: Refresh citation data

on:
  schedule:
    - cron: "0 0 1 * *"  # Monthly on the 1st
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Run unit tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Detect versions
        id: versions
        run: |
          LATEST=$(ls centralizator/ | grep -o 'v[0-9]*' | sort -V | tail -1)
          NEXT="v$((${LATEST#v} + 1))"
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "next=$NEXT" >> $GITHUB_OUTPUT
          echo "Latest version: $LATEST → Next: $NEXT"

      - name: Prepare next version raw folder
        run: |
          LATEST=${{ steps.versions.outputs.latest }}
          NEXT=${{ steps.versions.outputs.next }}
          mkdir -p "citari/$NEXT/raw/datacite_search"
          if [ -f "citari/$LATEST/raw/datacite_search/no_doi_publications.json" ]; then
            cp "citari/$LATEST/raw/datacite_search/no_doi_publications.json" "citari/$NEXT/raw/datacite_search/"
          fi

      - name: Fetch fresh citation data from sources
        run: |
          cd scripts
          python3 fetch_citation_sources.py --source-version ${{ steps.versions.outputs.latest }} --target-version ${{ steps.versions.outputs.next }}

      - name: Fetch Crossref counts
        run: |
          cd scripts
          python3 check_crossref_counts.py --source-version ${{ steps.versions.outputs.latest }} --target-version ${{ steps.versions.outputs.next }}

      - name: Build citation dataset
        run: |
          cd scripts
          python3 build_citations.py --source-version ${{ steps.versions.outputs.latest }} --target-version ${{ steps.versions.outputs.next }}

      - name: Build dashboard data
        run: |
          cd scripts
          python3 build_dashboard_data.py

      - name: Sync dashboard to docs for GitHub Pages
        run: |
          rsync -a --delete dashboard/ docs/
          # Ensure docs has the latest data
          echo "Synced dashboard → docs"

      - name: Update README with latest stats
        run: |
          cd scripts
          python3 update_readme.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: auto-refresh citation data $(date +%Y-%m-%d) — new version ${{ steps.versions.outputs.next }}"
          git push